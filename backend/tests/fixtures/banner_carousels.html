<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>
html,body{margin:0}.hero{width:1366px;height:520px;position:relative;overflow:hidden}.slide{display:none;width:1366px;height:520px}.slide.active{display:block}.slide img,.slide video{display:block;width:1366px;height:520px;object-fit:cover}.css-hero{background-image:url('https://example.com/third.webp');background-size:cover}.next{position:absolute;z-index:3;right:20px;top:240px}.lower{margin-top:300px;width:1366px;height:400px}
</style></head><body>
<section class="hero carousel">
  <div class="slide active"><a href="https://example.com/sale"><img alt="Sale Inverno" src="https://example.com/rendered-small.webp" srcset="https://example.com/first-1366.webp 1366w, https://example.com/first-2200.webp 2200w"></a></div>
  <div class="slide"><video src="https://example.com/interstitial.mp4"></video></div>
  <div class="slide css-hero" aria-label="Coleção Verão"></div>
  <button class="next" aria-label="Próximo">›</button>
  <i aria-label="Slide 1 of 3"></i><i aria-label="Slide 2 of 3"></i><i aria-label="Slide 3 of 3"></i>
</section>
<img class="lower" alt="Produto falso" src="https://example.com/product.webp">
<script>
const slides=[...document.querySelectorAll('.slide')];let active=0;
document.querySelector('.next').onclick=()=>{slides[active].classList.remove('active');active=(active+1)%slides.length;slides[active].classList.add('active')};
</script></body></html>
